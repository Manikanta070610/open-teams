# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: Postgres DB + public backend + admin backend + public frontend +
# admin frontend. The admin services are the back office: do not publish
# their URLs to employees.
# Deploy: push to GitHub, then Render Dashboard > New > Blueprint > select repo.
# DB schema is applied pre-deploy via `npm --prefix backend run migrate` (01..12 in order).
databases:
  - name: office-mgmt-db
    plan: free
    databaseName: office_mgmt_final
    user: office_mgmt

services:
  - type: web
    name: office-mgmt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: office-mgmt-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: ADMIN_MODE
        value: public
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
    # Schema is applied with the backend's migrate script (Node pg, no psql needed).
    # NOTE: 07_seed.sql is rerunnable (ON CONFLICT DO NOTHING) — safe to run on every deploy.
    preDeployCommand: npm --prefix backend install && npm --prefix backend run migrate

  - type: web
    name: office-mgmt-admin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: office-mgmt-db
          property: connectionString
      - key: ADMIN_MODE
        value: admin
      - key: ADMIN_PORT
        value: 4001
      - key: PORT
        value: 4001
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
    # NOTE: keep AUTH_SECRET identical to office-mgmt-backend (copy the generated
    # value over) so JWE access tokens verify on both services. SETUP_TOKEN must
    # be set manually on this service only for first-admin bootstrap, then removed.

  - type: web
    name: office-mgmt-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://office-mgmt-backend.onrender.com/api/$1

  - type: web
    name: office-mgmt-admin-frontend
    runtime: static
    staticPublishPath: ./frontend/dist-admin
    buildCommand: npm install --prefix frontend && npm run build:admin --prefix frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://office-mgmt-admin-backend.onrender.com/api/$1
