# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: Postgres DB + backend web service + frontend static site.
# Deploy: push to GitHub, then Render Dashboard > New > Blueprint > select repo.
# DB schema is applied pre-deploy via `npm --prefix backend run migrate` (01..11 in order).
databases:
  - name: office-mgmt-db
    plan: free
    databaseName: office_mgmt_final
    user: office_mgmt

services:
  - type: web
    name: office-mgmt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: office-mgmt-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
    # Schema is applied with the backend's migrate script (Node pg, no psql needed).
    # NOTE: 07_seed.sql is rerunnable (ON CONFLICT DO NOTHING) — safe to run on every deploy.
    preDeployCommand: npm --prefix backend install && npm --prefix backend run migrate

  - type: web
    name: office-mgmt-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://office-mgmt-backend.onrender.com/api/$1
