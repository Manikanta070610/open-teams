# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: Postgres DB + backend web service + frontend static site.
# Deploy: push to GitHub, then Render Dashboard > New > Blueprint > select repo.
# DB schema is applied as a post-deploy job via `psql -f` in numeric order.
databases:
  - name: office-mgmt-db
    plan: free
    databaseName: office_mgmt_final
    user: office_mgmt

services:
  - type: web
    name: office-mgmt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: office-mgmt-db
          property: connectionString
      - key: PORT
        value: 4000
    # Schema is applied with the backend's migrate script (Node pg, no psql needed).
    # NOTE: 07_seed.sql is not idempotent — run migrate manually once via
    # Render Shell on first deploy, then remove it from the chain or guard it.
    preDeployCommand: npm --prefix backend install && npm --prefix backend run migrate

  - type: web
    name: office-mgmt-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://office-mgmt-backend.onrender.com/api/$1
