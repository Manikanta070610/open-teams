# Static bundle + /api reverse proxy to the matching backend.
# BACKEND_URL is substituted at image build time (see Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend (same-origin, no CORS needed).
  location /api/ {
    proxy_pass __BACKEND_URL__/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: unknown paths serve the entry page.
  location / {
    try_files $uri $uri/ /__ENTRY_FILE__;
  }
}
